name: ror-chucknorris-facts-dev
services:
  ror:
    container_name: ror-chucknorris-facts-dev
    image: ${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}-dev
    build:
      context: .
      dockerfile: docker/ror/ror.dev.Dockerfile
    env_file: .env
    environment:
      - BASE_PATH=/app
    ports:
      - 3000:3000
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app
