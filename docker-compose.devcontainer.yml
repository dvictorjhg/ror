name: ror-chucknorris-facts-devcontainer
services:
  ror:
    container_name: ror-chucknorris-facts-devcontainer
    image: ${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG}-devcontainer
    userns_mode: "keep-id"
    build:
      dockerfile: docker/ror/ror.devcontainer.Dockerfile
    env_file: .env
    environment:
      - BASE_PATH=/workspace
    ports:
      - 3000:3000
    volumes:
      - ./:/workspace
